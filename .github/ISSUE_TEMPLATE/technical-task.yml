name: Tarefa técnica
description: Registre manutenção técnica para revisão de escopo
title: "[Task]: "
labels: ["type:task", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Intake apenas: esta Issue não autoriza execução. Aguarde escopo revisado e autorização explícita do mantenedor. Registre critérios de aceite, limites e evidências no PR vinculado."
  - type: textarea
    id: objective
    attributes:
      label: Objetivo técnico
      description: Descreva o resultado verificável da tarefa.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto e arquivos envolvidos
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridade
      options: [P0 - bloqueador, P1 - alta, P2 - normal, P3 - baixa]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área responsável
      multiple: true
      options: [Zoom e desenho, Captura de tela, Atalhos globais, Sobreposição, Linux, Windows, macOS, Segurança, Empacotamento, CI/CD, Documentação, Testes]
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Limites e não escopo
    validations:
      required: true
