name: Propor funcionalidade
description: Descreva um problema e um resultado verificável
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Intake apenas: esta Issue não autoriza implementação. Aguarde escopo revisado e autorização explícita do mantenedor; implemente em branch própria e PR vinculado, com critérios de aceite e evidências."
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Quem é afetado e por quê?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado esperado
      description: Descreva comportamento observável, não apenas uma implementação.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo e não escopo
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Segurança, compatibilidade e operação
      description: Considere privilégios, compatibilidade, rollback e auditoria.
  - type: dropdown
    id: priority
    attributes:
      label: Prioridade percebida
      options: [P0 - bloqueador, P1 - alta, P2 - normal, P3 - baixa]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Áreas envolvidas
      multiple: true
      options: [Zoom e desenho, Captura de tela, Atalhos globais, Sobreposição, Linux, Windows, macOS, Segurança, Empacotamento, CI/CD, Documentação, Testes]
    validations:
      required: true
  - type: checkboxes
    id: decision
    attributes:
      label: Decisão arquitetural
      options:
        - label: Avaliei se a proposta exige ADR.
          required: true