# Semente do Altivy.Groundwork (componente release), adaptada do antigo release.yml.
# Publica o pixelpointer em Native AOT para todos os RIDs suportados (ver docs/release.md),
# com SDL3 e libSkiaSharp ao lado do executavel.
# - workflow_call (gw-release.yml, apos o merge humano do Release PR): preflight privado opcional
#   com build, smoke, testes dos instaladores e SBOM; apos aprovacao de `distribution`, publica
#   os mesmos artifacts sem rebuild e anexa assets atestados a GitHub Release em rascunho.
#   Homebrew e winget usam workflows independentes apos a release publica.
# - pull_request que altera a cadeia de release: build, smoke e testes sem publicar.
# - workflow_call de gw-preview.yml com a candidata vX.Y.Z-rc.N: mesma publicacao, versao da tag,
#   publicada como prerelease sem Latest e validada no Environment quality.
# - workflow_dispatch preview em main: GitHub Pre-release preview.N apos aprovacao de
#   `distribution`; nunca promovivel nem implantavel.
name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Tag da release (vX.Y.Z)
        type: string
        required: false
        default: ''
      version:
        description: Versao da release (X.Y.Z)
        type: string
        required: false
        default: ''
      republish:
        description: Reenvio de artefatos ausentes de uma release existente
        type: boolean
        default: false
      preflight:
        description: Preparar e testar artefatos privados sem publicá-los
        type: boolean
        default: false
      publish_only:
        description: Publicar somente os artefatos preparados anteriormente no mesmo run
        type: boolean
        default: false
      preview:
        description: Gerar pacotes preview sem tag ou GitHub Release
        type: boolean
        default: false
      preview_suffix:
        description: Sufixo SemVer preview.<run-number>
        type: string
        default: ''
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/post-release.yml"
      - ".config/dotnet-tools.json"
      - "install/**"
      - "tests/installers/**"
      - "tools/build/**"
      - "tools/scripts/New-HomebrewFormula.ps1"
      - "tools/scripts/Update-HomebrewTap.ps1"
      - "tools/scripts/Publish-Aot.ps1"
      - "tools/scripts/Test-AotPackage.ps1"
      - "tools/scripts/Test-Installers.ps1"
      - "tools/scripts/Set-PreviewRelease.ps1"
      - "tools/scripts/Test-PreviewRelease.ps1"
      - "tools/scripts/ReleaseGovernance.psm1"
      - "tools/scripts/Assert-WingetSubmissionSource.ps1"
      - "tools/scripts/Test-WingetSubmissionPolicy.ps1"
  workflow_dispatch:
    inputs:
      preview:
        description: Publicar GitHub Pre-release da main apos aprovacao no Environment release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Version check, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      preview: ${{ steps.version.outputs.preview }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard source before building distributable packages
        if: ${{ github.event_name != 'pull_request' && (inputs.tag != '' || inputs.preview == true) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPUBLISH: ${{ inputs.republish || false }}
          PREFLIGHT: ${{ inputs.preflight || false }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          Import-Module ./tools/scripts/ci/GroundworkRelease.psm1
          $commit = (git rev-parse HEAD | Out-String).Trim()
          $stable = $env:RELEASE_TAG -ne '' -and -not (Test-CandidateTag $env:RELEASE_TAG)
          ./tools/scripts/ci/Assert-ReleaseSource.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $commit -DefaultBranch $env:DEFAULT_BRANCH -Stable:$stable -Republish:($env:REPUBLISH -eq 'true') -Preflight:($env:PREFLIGHT -eq 'true') -Tag $env:RELEASE_TAG
          exit $LASTEXITCODE

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          PREVIEW: ${{ inputs.preview || false }}
          PREVIEW_SUFFIX: ${{ inputs.preview_suffix || '' }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PREFLIGHT: ${{ inputs.preflight || false }}
          PUBLISH_ONLY: ${{ inputs.publish_only || false }}
        run: |
          if ($env:PREFLIGHT -eq 'true' -and $env:PUBLISH_ONLY -eq 'true') { throw 'Preflight e publish_only são modos mutuamente exclusivos.' }
          if ($env:PUBLISH_ONLY -eq 'true' -and -not $env:TAG) { throw 'publish_only exige uma tag preparada anteriormente.' }
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $prefix = @($props.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ })[0]
          $publish = 'false'
          $suffix = ''
          if ($env:PREVIEW -eq 'true') {
            if ($env:TAG) { throw 'Preview nao pode ser publicado a partir de uma tag.' }
            if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:REF_NAME -ne 'main') {
              throw 'Preview manual so pode ser gerada a partir da main.'
            }
            $config = Get-Content -LiteralPath .github/ci-cd.json -Raw | ConvertFrom-Json
            if (-not $config.publishSnapshots) { throw 'Preview desabilitado: publishSnapshots deve ser true.' }
            if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              $versionLines = @(& ./tools/scripts/ci/Get-BuildVersion.ps1 -Channel snapshot -RunNumber $env:RUN_NUMBER)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $versionValues = @{}
              foreach ($line in $versionLines) {
                if ($line -match '^([a-z_]+)=(.*)$') { $versionValues[$Matches[1]] = $Matches[2] }
              }
              if (-not $versionValues.ContainsKey('version_prefix') -or -not $versionValues.ContainsKey('version_suffix')) {
                throw 'Get-BuildVersion.ps1 nao devolveu os campos necessarios para snapshot.'
              }
              $prefix = $versionValues.version_prefix
              $suffix = $versionValues.version_suffix
            }
            else {
              $suffix = $env:PREVIEW_SUFFIX
              if ([string]::IsNullOrWhiteSpace($suffix)) { $suffix = "preview.$($env:RUN_NUMBER)" }
            }
            if ($suffix -notmatch '^preview\.\d{1,9}$') { throw "Sufixo preview invalido: '$suffix'." }
          }
          if ($env:TAG) {
            if ($env:PREVIEW -eq 'true') { throw 'Uma release estavel nao pode usar o canal preview.' }
            if ($env:TAG -cmatch '^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))-rc\.(0|[1-9]\d*)$') {
              # Candidata do gw-preview.yml (docs/estrategia-de-release.md): a tag fica no commit-base do
              # Release PR, antes do bump; a versao vem da tag, e o build sobrescreve o VersionPrefix.
              $prefix = $Matches[1]
              $suffix = "rc.$($Matches[2])"
            }
            # gw-release.yml ja validou tag, versoes e ancestralidade; aqui confirma o checkout da tag.
            elseif ($env:TAG -cne "v$prefix") {
              Write-Output "::error::Tag '$($env:TAG)' difere de VersionPrefix $prefix em Directory.Build.props."
              exit 1
            }
            $publish = 'true'
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "preview=$($env:PREVIEW.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version_suffix=$suffix" >> $env:GITHUB_OUTPUT
          $displayVersion = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          "version_prefix=$prefix" >> $env:GITHUB_OUTPUT
          "version=$displayVersion" >> $env:GITHUB_OUTPUT
          Write-Output "Versao: $displayVersion (preview: $($env:PREVIEW); publicar: $publish)"

      - name: Build and tests in container
        if: ${{ inputs.publish_only != true }}
        shell: pwsh
        run: |
          ./tools/scripts/Test-WingetSubmissionPolicy.ps1
          ./tools/scripts/Invoke-Validation.ps1 -Engine docker

  build:
    name: Publish ${{ matrix.rid }}
    needs: validate
    if: ${{ needs.validate.outputs.publish == 'true' && inputs.publish_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04 }
          - { rid: win-x64, runner: windows-2025 }
          - { rid: win-arm64, runner: windows-11-arm }
          - { rid: osx-arm64, runner: macos-15 }
          - { rid: osx-x64, runner: macos-15-intel }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - name: Setup .NET (native toolchain)
        if: ${{ !startsWith(matrix.rid, 'linux-') }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish Native AOT package
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          VERSION_SUFFIX: ${{ needs.validate.outputs.version_suffix }}
          VERSION_PREFIX: ${{ needs.validate.outputs.version_prefix }}
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $props.SelectSingleNode('/Project/PropertyGroup/VersionPrefix').InnerText = $env:VERSION_PREFIX
          $props.Save((Join-Path $PWD 'Directory.Build.props'))
          $arguments = @{ Rid = $env:RID }
          if (-not [string]::IsNullOrWhiteSpace($env:VERSION_SUFFIX)) { $arguments.VersionSuffix = $env:VERSION_SUFFIX }
          if ($IsLinux) { $arguments.Engine = 'docker' }
          ./tools/scripts/Publish-Aot.ps1 @arguments
          exit $LASTEXITCODE

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}-${{ github.run_attempt }}
          path: artifacts/release/pixelpointer-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 7


  verify:
    name: Smoke and installers (${{ matrix.runner }})
    needs: [validate, build]
    if: ${{ needs.validate.outputs.publish == 'true' && inputs.publish_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, rids: "linux-x64" }
          - { runner: ubuntu-24.04-arm, rids: "linux-arm64" }
          - { runner: windows-2025, rids: "win-x64" }
          - { runner: windows-11-arm, rids: "win-arm64" }
          - { runner: macos-15, rids: "osx-arm64" }
          - { runner: macos-15-intel, rids: "osx-x64" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts/release

      - name: Smoke test packages
        shell: pwsh
        env:
          RIDS: ${{ matrix.rids }}
          VERSION_SUFFIX: ${{ needs.validate.outputs.version_suffix }}
          VERSION_PREFIX: ${{ needs.validate.outputs.version_prefix }}
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $props.SelectSingleNode('/Project/PropertyGroup/VersionPrefix').InnerText = $env:VERSION_PREFIX
          $props.Save((Join-Path $PWD 'Directory.Build.props'))
          ./tools/scripts/Publish-Aot.ps1 -ChecksumsOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($rid in $env:RIDS -split ' ') {
            $arguments = @{ Rid = $rid }
            if (-not [string]::IsNullOrWhiteSpace($env:VERSION_SUFFIX)) { $arguments.VersionSuffix = $env:VERSION_SUFFIX }
            if ($IsLinux) { $arguments.Engine = 'docker' }
            ./tools/scripts/Test-AotPackage.ps1 @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test installers
        shell: pwsh
        run: |
          $arguments = @{}
          if ($IsLinux) { $arguments.Engine = 'docker' }
          ./tools/scripts/Test-Installers.ps1 @arguments
          exit $LASTEXITCODE


  attest-sbom:
    # Antes dos assets e da aprovacao: a release so fica publica com o SBOM de cada pacote atestado.
    name: Attest SBOM ${{ matrix.rid }}
    needs: [validate, build, verify]
    if: ${{ inputs.publish_only != true && (needs.validate.outputs.publish == 'true' || (needs.validate.outputs.preview == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, subjects: "dist/pixelpointer-linux-x64.tar.gz,dist/pixelpointer-linux-x64.deb" }
          - { rid: linux-arm64, subjects: "dist/pixelpointer-linux-arm64.tar.gz,dist/pixelpointer-linux-arm64.deb" }
          - { rid: win-x64, subjects: "dist/pixelpointer-win-x64.zip" }
          - { rid: win-arm64, subjects: "dist/pixelpointer-win-arm64.zip" }
          - { rid: osx-arm64, subjects: "dist/pixelpointer-osx-arm64.tar.gz" }
          - { rid: osx-x64, subjects: "dist/pixelpointer-osx-x64.tar.gz" }
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ matrix.rid }}-${{ github.run_attempt }}
          path: dist

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.subjects }}
          sbom-path: dist/pixelpointer-${{ matrix.rid }}.spdx.json

  release-assets:
    name: Prepare release assets
    needs: [validate, build, verify, attest-sbom]
    if: ${{ !cancelled() && inputs.publish_only != true && needs.validate.result == 'success' && needs.build.result == 'success' && needs.verify.result == 'success' && (needs.attest-sbom.result == 'success' || needs.attest-sbom.result == 'skipped') && (needs.validate.outputs.publish == 'true' || needs.validate.outputs.preview == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Add installers and checksums
        shell: pwsh
        env:
          PREVIEW: ${{ needs.validate.outputs.preview }}
        run: |
          if ($env:PREVIEW -ne 'true') {
            Copy-Item -LiteralPath install/install.sh, install/install.ps1 -Destination dist
          }
          ./tools/scripts/Publish-Aot.ps1 -ChecksumsOnly -OutputDirectory dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Preview: 6 pacotes + 6 SBOMs SPDX + 2 .deb; release estavel inclui 2 instaladores.
          $expected = if ($env:PREVIEW -eq 'true') { 14 } else { 16 }
          $count = @(Get-ChildItem -LiteralPath dist -File | Where-Object Name -ne 'SHA256SUMS').Count
          if ($count -ne $expected) {
            Write-Output "::error::Esperados $expected arquivos de release, encontrados $count."
            exit 1
          }
          Get-Content -LiteralPath dist/SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.validate.outputs.preview == 'true' && format('pixelpointer-preview-{0}-{1}', github.run_id, github.run_attempt) || 'release-assets' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-assets:
    name: Publish release assets
    needs: [validate, release-assets]
    if: ${{ !cancelled() && inputs.preflight != true && needs.validate.outputs.publish == 'true' && (inputs.publish_only == true || needs.release-assets.result == 'success') }}
    uses: ./.github/workflows/gw-github-assets.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
      checks: read
      pull-requests: read
    with:
      tag: ${{ inputs.tag }}
      artifact-name: release-assets
      republish: ${{ inputs.republish || false }}

  authorize-preview-distribution:
    name: Authorize public preview ${{ needs.validate.outputs.version }} at ${{ github.sha }}
    needs: [validate, release-assets, attest-sbom]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.outputs.preview == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: distribution
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout approved preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate source after distribution approval
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ./tools/scripts/ci/Assert-ReleaseSource.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -DefaultBranch $env:DEFAULT_BRANCH
          exit $LASTEXITCODE

  publish-preview:
    name: Publish GitHub Pre-release
    needs: [validate, release-assets, attest-sbom, authorize-preview-distribution]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.outputs.preview == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
      checks: read
      pull-requests: read
    env:
      PREVIEW_VERSION: ${{ needs.validate.outputs.version }}
      PREVIEW_COMMIT: ${{ github.sha }}
      DISTRIBUTION_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pixelpointer-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-assets

      - name: Validate preview publication inputs
        shell: pwsh
        run: |
          ./tools/scripts/Set-PreviewRelease.ps1 -Version $env:PREVIEW_VERSION -Commit $env:PREVIEW_COMMIT
          exit $LASTEXITCODE

      - name: Create release GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Prepare immutable preview draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          ./tools/scripts/Set-PreviewRelease.ps1 -Version $env:PREVIEW_VERSION -Commit $env:PREVIEW_COMMIT -Publish
          exit $LASTEXITCODE

      - name: Attest preview provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release-assets/*

      - name: Upload preview assets without overwriting
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          ./tools/scripts/ci/Publish-ReleaseAssets.ps1 -Tag "v$($env:PREVIEW_VERSION)" -Path artifacts/release-assets -EntriesPath artifacts/release-entries/preview.json
          exit $LASTEXITCODE

      - name: Publish verified preview without changing Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          ./tools/scripts/Set-PreviewRelease.ps1 -Stage publish -Version $env:PREVIEW_VERSION -Commit $env:PREVIEW_COMMIT -Publish
          exit $LASTEXITCODE
