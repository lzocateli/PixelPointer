# Semente do Altivy.Groundwork (componente release): verificações pós-release sem distribuição.
# Homebrew e winget são iniciados por workflows independentes e exigem versão explícita.
name: Post release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag da release publicada (vX.Y.Z)
        type: string
        required: true
      version:
        description: Versao da release (X.Y.Z)
        type: string
        required: true
      republish:
        description: Execucao do modo republish de uma release existente
        type: boolean
        default: false

permissions: {}

jobs:
  record:
    name: Record published release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Confirm no downstream registry was started
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          echo "Release $RELEASE_TAG ($RELEASE_VERSION) published; Homebrew and winget require separate version-specific dispatches."
          echo "republish=$REPUBLISH"
